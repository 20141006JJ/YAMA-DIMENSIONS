<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Untitled</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quantum Engine 7.0 Ultima</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-universe">
  <div id="danger-vignette" class="vignette-fx"></div>
  <div class="scanlines"></div>

  <div id="ui-main-menu" class="overlay-screen">
    <h1 class="glitch-text">QUANTUM 7.0</h1>
    <p style="color:#00f0ff; font-size:12px; margin-top:-10px;">ULTIMA EDITION · 雙平台極致版</p>
    
    <div class="lobby-container">
      
      <div class="menu-panel">
        <div class="input-row">
          <span style="color:#94a3b8; font-size:12px;">我的 ID</span>
          <input type="text" id="input-name" value="量子遊俠" />
        </div>
        <div class="input-row">
          <span style="color:#94a3b8; font-size:12px;">連線房號</span>
          <input type="text" id="input-room" value="ROOM_777" />
        </div>
        <button class="btn-core mode-device" id="btn-toggle-device" onclick="Engine.toggleDevice()">📱 目前：PC 鍵盤 (點擊切換手機)</button>
        <hr style="border-color:#1e293b; width:100%; margin:5px 0;">
        
        <div class="mode-grid">
          <button class="btn-core mode-training" onclick="Engine.launch('TRAINING')">🎯 虛擬靶場 (訓練)</button>
          <button class="btn-core mode-public" onclick="Engine.launch('PUBLIC')">🌍 線上大廳 (PVE)</button>
          <button class="btn-core mode-pvp" onclick="Engine.launch('PVP')">⚔️ 跨服死鬥 (匹配)</button>
          <button class="btn-core mode-ranked" onclick="Engine.launch('RANKED')">🏆 積分排位賽 (S1賽季)</button>
        </div>
      </div>

      <div class="friends-panel">
        <div class="friends-header">🌐 NETWORK / 聯絡人</div>
        <div class="friends-list">
          <div class="friend-row"><span class="dot online"></span><span class="name">霓虹刺客_99</span><button class="btn-invite">邀請</button></div>
          <div class="friend-row"><span class="dot online"></span><span class="name">NightCity_AK</span><button class="btn-invite">邀請</button></div>
          <div class="friend-row"><span class="dot in-game"></span><span class="name">量子狂熱者</span><span class="status-text">戰鬥中</span></div>
          <div class="friend-row"><span class="dot in-game"></span><span class="name">Zero_Bug</span><span class="status-text">匹配中</span></div>
          <div class="friend-row"><span class="dot offline"></span><span class="name">Glitch_Cat</span><span class="status-text">離線</span></div>
          <div class="friend-row"><span class="dot offline"></span><span class="name">系統管理員</span><span class="status-text">離線</span></div>
        </div>
      </div>

    </div>
  </div>

  <div id="ui-overlay-mask" class="center-overlay hidden">
    <div id="txt-overlay-msg" class="countdown-text">READY</div>
  </div>

  <div id="ui-game-viewport" class="hidden">
    <div class="hud-top">
      <div class="hud-block">房號: <span id="hud-room">---</span></div>
      <div class="hud-block">玩家: <span id="hud-name">---</span></div>
      <div class="hud-block">座標: <span id="hud-pos">X:0 Y:0</span></div>
      <div class="hud-block">戰績: <span id="hud-kda" style="color:#f59e0b;">0 殺 / 0 死</span></div>
      <button onclick="Engine.exitGame()" style="background:#ef4444; border:none; color:#fff; border-radius:3px; cursor:pointer; padding: 2px 10px;">🚪 退出</button>
    </div>

    <div class="player-vital-panel">
      <div class="vital-row"><span style="font-size:10px; color:#fff; width:20px;">HP</span><div class="bar-frame"><div id="bar-hp" class="bar-fill hp-fill"></div></div></div>
      <div class="vital-row"><span style="font-size:10px; color:#fff; width:20px;">MP</span><div class="bar-frame"><div id="bar-mp" class="bar-fill mp-fill"></div></div></div>
    </div>

    <div class="main-battlefield">
      <canvas id="gameCanvas"></canvas>
      
      <div id="mobile-ui" class="hidden">
        <div class="joystick-zone" id="joy-zone"><div class="joystick-knob" id="joy-knob"></div></div>
        <div class="action-zone">
          <div class="btn-mobile-action" ontouchstart="Engine.cast('Q')">Q<br><span style="font-size:8px;">火球</span><div class="cd-overlay" id="mcd-q"></div></div>
          <div class="btn-mobile-action" ontouchstart="Engine.cast('E')">E<br><span style="font-size:8px;">旋風</span><div class="cd-overlay" id="mcd-e"></div></div>
          <div class="btn-mobile-action" ontouchstart="Engine.cast('Shift')" style="border-color:#10b981;">閃<br><span style="font-size:8px;">位移</span><div class="cd-overlay" id="mcd-shift"></div></div>
          <div class="btn-mobile-action atk" ontouchstart="Engine.attack()">⚔️<br><span style="font-size:10px;">攻擊</span></div>
        </div>
      </div>
    </div>

    <div id="pc-footer" class="pc-footer hidden">
      <div class="skill-slot"><span class="key-cap">Space</span> ⚔️ 普攻斬擊</div>
      <div class="skill-slot"><span class="key-cap">Q</span> 🔥 火球 <div class="cd-overlay" id="pcd-q"></div></div>
      <div class="skill-slot"><span class="key-cap">E</span> 🌌 旋風斬 <div class="cd-overlay" id="pcd-e"></div></div>
      <div class="skill-slot" style="border-color:#10b981;"><span class="key-cap" style="background:#10b981;">Shift</span> ⚡ 閃現 <div class="cd-overlay" id="pcd-shift"></div></div>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
    <script  src="./script.js"></script>

  </body>
  
</html>
