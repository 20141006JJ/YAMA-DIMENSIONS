<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Untitled</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <!-- 1. 攔截匹配的排隊彈窗 (可放置於 lobby-container 內) -->
<div id="matchmaking-modal" class="hidden">
  <div class="match-spinner"></div>
  <div class="match-status">正在搜尋對手...</div>
  <div id="match-timer">00:00</div>
  <button class="btn-core" onclick="Engine.cancelMatchmaking()">取消匹配</button>
</div>

<!-- 2. 修改或擴充你原本的 hud-top (結合特戰英豪 1v1 ~ 5v5 動態頭像) -->
<div id="custom-game-hud" class="hidden">
  <!-- 藍方隊伍頭像區 (動態生成) -->
  <div class="hud-team-avatars team-blue" id="hud-avatars-blue"></div>
  
  <!-- 中央比分板 -->
  <div class="hud-score-center">
    <span id="hud-score-blue" class="score-num blue-text">0</span>
    <span class="score-divider">:</span>
    <span id="hud-score-red" class="score-num red-text">0</span>
  </div>
  
  <!-- 紅方隊伍頭像區 (動態生成) -->
  <div class="hud-team-avatars team-red" id="hud-avatars-red"></div>
</div>

<!-- 3. 精緻帥氣的牌位升級動畫全螢幕覆蓋層 -->
<div id="rank-upgrade-overlay" class="hidden">
  <div class="rank-glow-burst"></div>
  <div class="rank-card-animate">
    <div class="metallic-shine"></div>
    <div class="rank-subtitle">RANK UP</div>
    <div class="rank-icon-spark">✦</div>
    <div class="rank-tier-text">神話特務 III (RADIANT)</div>
    <div class="rank-bar-container">
      <div class="rank-bar-fill"></div>
    </div>
  </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
